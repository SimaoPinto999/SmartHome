spring.application.name=smarthome
server.port=8081

# Base de Dados (Nome do serviço no Compose)
spring.datasource.url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:smarthome}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate

# MQTT Configuration (RabbitMQ service name)
spring.mqtt.url=tcp://rabbitmq:1883
spring.mqtt.username=${RABBITMQ_USER:smarthome}
spring.mqtt.password=${RABBITMQ_PASS}
spring.mqtt.client-id=smarthome-backend
spring.mqtt.topic=home/#

# InfluxDB Configuration (Influxdb service name)
influxdb.url=http://influxdb:8086
influxdb.token=${INFLUXDB_TOKEN}
influxdb.org=smarthome
influxdb.bucket=smarthome_metrics

# RabbitMQ
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672

# Disable automatic export of metrics to InfluxDB
management.influx.metrics.export.enabled=false

# Authentik OIDC (Internal network names)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://authentik-server:9000/application/o/smarthome/
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://authentik-server:9000/application/o/smarthome/jwks/