# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# Configuração do Authentik para o SmartHome, aplicada automaticamente no
# primeiro arranque (montada em /blueprints/custom pelo docker-compose.yml).
version: 1
metadata:
  name: SmartHome
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # ─── Provider OAuth2/OIDC (cliente público, PKCE) usado pelo frontend ───────
  - model: authentik_providers_oauth2.oauth2provider
    id: smarthome-provider
    identifiers:
      name: SmartHome Provider
    attrs:
      client_type: public
      # Público e igual ao client_id de frontend/src/oidc.config.ts
      client_id: PApuDUh4HPeMF81K26F5Z1K7NYTH44HA9JD4UWx5
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      issuer_mode: per_provider
      access_token_validity: minutes=60
      refresh_token_validity: days=30
      redirect_uris:
        - matching_mode: strict
          url: http://localhost:3000/callback
        - matching_mode: strict
          url: http://localhost:3000/
        - matching_mode: strict
          url: http://localhost:3000
        - matching_mode: strict
          url: http://localhost:8081/swagger-ui/oauth2-redirect.html
        - matching_mode: strict
          url: https://oauth.pstmn.io/v1/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]

  # ─── Aplicação ──────────────────────────────────────────────────────────────
  - model: authentik_core.application
    identifiers:
      slug: smarthome
    attrs:
      name: SmartHome
      provider: !KeyOf smarthome-provider
      meta_launch_url: http://localhost:3000

  # ─── Contas de demonstração (passwords vêm do .env, ver DEMO_*) ─────────────
  # state: created -> só cria; alterações feitas depois na UI não são repostas.
  - model: authentik_core.user
    state: created
    identifiers:
      username: MariaSilveira
    attrs:
      name: MariaSilveira
      email: !Env [DEMO_MARIA_EMAIL, mariasilveira@email.com]
      password: !Env DEMO_MARIA_PASSWORD
      path: users
      is_active: true

  - model: authentik_core.user
    state: created
    identifiers:
      username: jonas
    attrs:
      name: Jonas Pistolas
      email: !Env [DEMO_JONAS_EMAIL, jonaspistolas@email.com]
      password: !Env DEMO_JONAS_PASSWORD
      path: users
      is_active: true
